name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - uses: actions/checkout@v4
      - name: Tap local repo
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/jagritvats"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/jagritvats/homebrew-tap"
      - name: Install
        run: brew install --build-from-source jagritvats/tap/eyesonly
      - name: Test
        run: brew test jagritvats/tap/eyesonly
      - name: Audit
        run: brew audit --strict --formula jagritvats/tap/eyesonly
